<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2b2f36; font-family: "Noto Sans JP", sans-serif; min-height: 100vh; }
  .bar { position: sticky; top: 0; z-index: 10; background: #1c1f24; color: #cfd5de; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
  .bar .label { opacity: .7; }
  .bar button { background: #3a3f48; color: #fff; border: 0; padding: 7px 11px; border-radius: 8px; font: inherit; cursor: pointer; }
  .bar b { color: #fff; }
  .stage { padding: 16px; display: flex; justify-content: center; }
  .scaler { transform-origin: top left; }

  .frame {
    --blue: #0000c8; --fam: #a61e4d; --c-visit: #0000c8; --c-med: #0f8a7e; --c-vend: #6b7280; --c-call: #e07b00; --c-err: #d23c3c; --ok: #1a8f5a;
    --bg: #f6f7fb; --panel: #fff; --text: #1d2140; --sub: #63688a; --line: #e5e7f2;
    width: 1280px; height: 800px; border-radius: 22px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 12px #111, 0 20px 60px rgba(0,0,0,.5);
    background: var(--bg); color: var(--text); font-family: "Noto Sans JP", sans-serif; display: flex; flex-direction: column;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }
  input, select { font-family: inherit; }

  /* ヘッダー */
  .ahead { display: flex; align-items: center; gap: 16px; padding: 14px 28px; background: #fff; border-bottom: 1px solid var(--line); flex: none; }
  .ahead .logo { height: 30px; }
  .ahead .ttl { font-size: 18px; font-weight: 700; }
  .ahead .ttl small { font-weight: 500; font-size: 14px; color: var(--sub); margin-left: 8px; }
  .ahead .sp { flex: 1; }
  .tbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 16px; font-size: 15px; font-weight: 700; }
  .tbtn svg { width: 18px; height: 18px; }
  .tbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .tbtn.danger { background: var(--c-err); border-color: var(--c-err); color: #fff; }
  .tbtn.off { color: var(--sub); }
  .tbtn.sm { padding: 6px 12px; font-size: 14px; }

  /* 待機中 */
  .idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .st { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: var(--ok); background: #e6f6ee; border-radius: 999px; padding: 10px 22px; }
  .st i { width: 12px; height: 12px; border-radius: 50%; background: #1fb26b; animation: pulse 2s ease-in-out infinite; }
  .st.stop { color: var(--c-err); background: #fdeaea; }
  .st.stop i { background: var(--c-err); animation: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(31,178,107,.25); } 50% { box-shadow: 0 0 0 9px rgba(31,178,107,.06); } }
  .bigclock { font-size: 160px; font-weight: 700; letter-spacing: .02em; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 18px; }
  .bigdate { font-size: 28px; color: var(--sub); }
  .counts { display: flex; gap: 14px; margin-top: 40px; }
  .count { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 24px; display: flex; align-items: center; gap: 12px; font-size: 17px; color: var(--sub); }
  .count .dot { width: 12px; height: 12px; border-radius: 50%; }
  .count b { font-size: 28px; color: var(--text); }
  .idle-foot { display: flex; justify-content: center; gap: 14px; padding: 0 0 28px; }
  .blackout { position: absolute; inset: 0; z-index: 25; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #777; }
  .blackout .hint { font-size: 15px; opacity: .0; transition: opacity .3s; }
  .blackout.show .hint { opacity: 1; }
  .blackout .tbtn { display: none; }
  .blackout.show .tbtn { display: inline-flex; }

  /* 画面いっぱいの通知 */
  .full { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .pill { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 8px 20px; }
  .pill svg { width: 22px; height: 22px; }
  .pill.ring { animation: blink2 1s ease-in-out infinite; }
  @keyframes blink2 { 50% { opacity: .5; } }
  .full .kind { font-size: 32px; font-weight: 700; margin-top: 28px; opacity: .95; }
  .full .who { font-size: 72px; font-weight: 900; margin-top: 10px; }
  .full .who small { font-size: 34px; font-weight: 700; margin-left: 10px; }
  .full .meta { font-size: 26px; margin-top: 14px; opacity: .92; }
  .full .meta b { font-size: 30px; }
  .full .ok { margin-top: 44px; background: #fff; border: 0; border-radius: 22px; font-size: 34px; font-weight: 900; padding: 22px 120px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .full .note { margin-top: 18px; font-size: 17px; opacity: .85; }
  .full .timer { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: rgba(255,255,255,.2); }
  .full .timer i { display: block; height: 100%; background: #fff; transition: width 1s linear; }
  .full .tm { position: absolute; top: 28px; right: 36px; font-size: 22px; font-weight: 700; opacity: .9; }
  .full .queue { position: absolute; top: 28px; left: 36px; font-size: 18px; font-weight: 700; background: rgba(255,255,255,.2); padding: 6px 14px; border-radius: 999px; }

  .handling { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
  .handling .band { display: flex; align-items: center; gap: 14px; color: #fff; padding: 18px 32px; font-size: 22px; font-weight: 700; }
  .handling .band svg { width: 26px; height: 26px; }
  .handling .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .dcard { width: 820px; background: #fff; border-radius: 22px; border: 1px solid var(--line); padding: 10px 36px; }
  .drow { display: flex; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .drow:last-child { border: 0; }
  .drow .k { width: 180px; font-size: 18px; color: var(--sub); flex: none; }
  .drow .v { font-size: 30px; font-weight: 700; }
  .done-btn { margin-top: 34px; border: 0; color: #fff; border-radius: 18px; font-size: 28px; font-weight: 900; padding: 20px 90px; }

  /* 通知の開始 */
  .start { position: absolute; inset: 0; z-index: 30; background: rgba(246,247,251,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .start h2 { font-size: 34px; }
  .start p { font-size: 20px; color: var(--sub); line-height: 1.7; }
  .start .tbtn { font-size: 24px; padding: 18px 48px; margin-top: 10px; }

  /* 管理（左メニュー） */
  .admin { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px 1fr; }
  .snav { background: #fff; border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
  .ni { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; font-size: 16px; font-weight: 700; color: var(--sub); border: 0; background: transparent; text-align: left; }
  .ni svg { width: 20px; height: 20px; flex: none; }
  .ni.on { background: #ecedfc; color: var(--blue); }
  .ni .lk { margin-left: auto; opacity: .5; }
  .ni .lk svg { width: 14px; height: 14px; }
  .snav .sep { height: 1px; background: var(--line); margin: 10px 4px; }
  .snav .back { margin-top: auto; }
  .amain { padding: 22px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; }
  .amain h2 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
  .amain h2 .sp { flex: 1; }
  .lead { font-size: 15px; color: var(--sub); margin-top: -8px; }
  .panel { background: #fff; border-radius: 14px; border: 1px solid var(--line); }
  .filters { display: flex; gap: 12px; align-items: center; padding: 14px 18px; flex-wrap: wrap; }
  .inp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 16px; color: var(--text); background: var(--bg); min-width: 150px; }
  .inp.wide { width: 100%; }
  .chipsel { display: flex; gap: 6px; flex-wrap: wrap; }
  .chipsel button { font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--sub); background: #fff; }
  .chipsel button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .ml { margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 14px; color: var(--sub); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fafbfe; white-space: nowrap; }
  td { font-size: 15px; padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.t { font-variant-numeric: tabular-nums; color: var(--sub); }
  .tag { display: inline-flex; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
  tr.fam td { background: #fbf0f4; }
  .empty { padding: 40px; text-align: center; color: var(--sub); }

  /* 設定フォーム */
  .form { padding: 6px 22px; }
  .fr { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .fr:last-child { border-bottom: 0; }
  .fr .k { font-size: 16px; font-weight: 700; }
  .fr .k small { display: block; font-size: 13px; color: var(--sub); font-weight: 400; margin-top: 2px; }
  .fr .v { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 15px; color: var(--sub); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 9px 16px; font-size: 15px; font-weight: 700; color: var(--sub); border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--blue); color: #fff; }
  .num { width: 90px; text-align: right; }
  .sect { font-size: 15px; font-weight: 700; color: var(--sub); margin: 6px 0 -6px; }
  .savebar { display: flex; justify-content: flex-end; gap: 10px; }
  .toast { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); background: #1d2140; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: 700; z-index: 40; animation: fade .2s; }

  /* 一覧の編集 */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .lst .lh { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .li { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .li:last-child { border-bottom: 0; }
  .li .n { flex: 1; }
  .ib { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: grid; place-items: center; color: var(--sub); }
  .ib svg { width: 16px; height: 16px; }
  .ib.del { color: var(--c-err); }
  .addrow { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: #fafbfe; border-radius: 0 0 14px 14px; }
  .addrow .inp { flex: 1; min-width: 0; }
  .src { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: #eef0f8; color: var(--sub); }

  /* 起動・停止 */
  .power { padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .power .big { font-size: 34px; font-weight: 700; }
  .power p { font-size: 17px; color: var(--sub); line-height: 1.7; }

  /* モーダル（パスワードなど） */
  .modal { position: absolute; inset: 0; z-index: 35; background: rgba(20,24,60,.45); display: grid; place-items: center; }
  .mbox { width: 520px; background: #fff; border-radius: 20px; padding: 30px 32px; box-shadow: 0 30px 80px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 16px; }
  .mbox h3 { font-size: 22px; }
  .mbox p { font-size: 15px; color: var(--sub); line-height: 1.7; }
  .mbox .row { display: flex; gap: 10px; justify-content: flex-end; }
  .mbox .err { color: var(--c-err); font-size: 14px; font-weight: 700; }

  /* 端末登録 */
  .reg { flex: 1; display: grid; place-items: center; }
  .reg .mbox { box-shadow: 0 10px 40px rgba(0,0,0,.08); border: 1px solid var(--line); width: 600px; }
  .reg img { height: 44px; align-self: flex-start; }
</style>
</head>
<body>

<div class="bar">
  <span class="label">試す:</span>
  <button onclick="incoming('visit')">面会者が来た（お知らせ）</button>
  <button onclick="incoming('med')">クリニック/薬局が来た</button>
  <button onclick="incoming('fam')">ご家族が来た（呼び出し）</button>
  <button onclick="incoming('call')">スタッフ呼び出し</button>
  <button onclick="incoming('nf')">入居者が見つからない</button>
  <button onclick="incoming('err')">扉が開かなかった</button>
  <button onclick="openUnregistered()">未登録の端末で開く</button>
  <span>管理パスワード（ダミー） <b>0000</b></span>
</div>
<div class="stage"><div class="scaler" id="scaler"><div class="frame" id="frame"></div></div></div>

<script>

/* ================= ダミーデータ ================= */

/* ================= 音（ブラウザで鳴らす合成音。本番も同じ方式にできる） ================= */
let AC = null;
const ac = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
function tone(freq, start, dur, type = 'sine', vol = .25) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq; o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.start(t); o.stop(t + dur + .05);
}
const NOTICE_SOUNDS = [
  ['ピン', () => tone(1568, 0, .5)],
  ['ポン', () => tone(880, 0, .6, 'sine', .3)],
  ['ピンポン', () => { tone(1319, 0, .45); tone(1047, .28, .7); }],
  ['チャイム', () => { tone(1047, 0, .5, 'triangle'); tone(1319, .18, .5, 'triangle'); tone(1568, .36, .8, 'triangle'); }],
];
const CALL_SOUNDS = [
  ['ピリリ（電話風）', () => { for (let i = 0; i < 8; i++) tone(i % 2 ? 1320 : 1660, i * .06, .06, 'square', .12); for (let i = 0; i < 8; i++) tone(i % 2 ? 1320 : 1660, .7 + i * .06, .06, 'square', .12); }, 1600],
  ['ピンポーン（繰り返し）', () => { tone(1319, 0, .5); tone(1047, .4, .9); }, 1800],
  ['ピピピ（アラーム）', () => { [0, .18, .36].forEach(t => tone(2093, t, .12, 'square', .1)); }, 1000],
  ['チャイム（繰り返し）', () => { tone(784, 0, .5, 'triangle'); tone(988, .2, .5, 'triangle'); tone(1175, .4, .5, 'triangle'); tone(1568, .6, .9, 'triangle'); }, 2000],
];
let ringTimer = null;
function startRing() { stopRing(); if (!DB.settings.soundOn) return; const s = CALL_SOUNDS[DB.settings.callSound]; s[1](); ringTimer = setInterval(s[1], s[2]); }
function stopRing() { clearInterval(ringTimer); ringTimer = null; }
function pin() { if (DB.settings.soundOn) NOTICE_SOUNDS[DB.settings.noticeSound][1](); }

function overlayHTML() {
  if (handling) {
    const c = CALL_TEXT[handling.kind];
    return `<div class="handling"><div class="band" style="background:${KIND[handling.kind][1]}">${IC.check}確認しました（音を止めました）</div>
      <div class="body"><div class="dcard">${c[3].map(([k, v], i) => `<div class="drow"><div class="k">${k}</div><div class="v" ${i === 0 ? `style="color:${KIND[handling.kind][1]}"` : ''}>${v}</div></div>`).join('')}<div class="drow"><div class="k">受付時刻</div><div class="v">${handling.time}</div></div></div>
      <button class="done-btn" style="background:${KIND[handling.kind][1]}" data-act="done">対応完了</button></div></div>`;
  }
  if (showing) {
    const q = queue.length ? `<div class="queue">ほかに ${queue.length} 件あります</div>` : '';

      const c = CALL_TEXT[showing.kind];

  return `<div class="reg"><div class="mbox"><img src="assets/logo-horizontal-nochar.webp" alt=""><h3>この端末は登録されていません</h3>
    <p>受付アプリを使うには、この端末を登録してください。登録は最初の1回だけです。</p>
    <div><div style="font-size:14px;font-weight:700;margin-bottom:6px">端末の種類</div><span class="seg"><button class="on">事務所用（通知を受ける）</button><button>受付用（来館者が使う）</button></span></div>
    <input class="inp" placeholder="端末の名前（例: 事務所タブレット）"><input class="inp" type="password" placeholder="管理パスワード">
    <div class="row"><button class="tbtn primary" data-act="regDone">登録する</button></div></div></div>`;
}

function startHTML() {
  return `<div class="start"><h2>事務所モニター</h2><p>来館の通知を受け取るために、下のボタンを押してください。<br>（ブラウザの決まりで、一度押さないと音を鳴らせません）</p>
    <button class="tbtn primary" data-act="startNotify">${IC.bell}通知を開始</button></div>`;
}

/* ================= 描画 ================= */
function render() {
  let html;
  if (!registered) html = `${head('端末登録')}${regHTML()}`;
  else if (!DB.running) html = `<div class="blackout ${blackShow ? 'show' : ''}" data-act="wake"><div class="hint">受付を停止しています（受付画面も真っ暗です）</div><button class="tbtn primary" style="font-size:22px;padding:16px 40px;background:var(--ok);border-color:var(--ok)" data-act="resume">${IC.power}受付を再開する</button></div>`;
  else html = (view === 'admin' ? adminHTML() : idleHTML()) + overlayHTML() + (view === 'start' ? startHTML() : '');
  frame.innerHTML = html + modalHTML() + (toast ? `<div class="toast">${toast}</div>` : '');
  const pw = document.getElementById('pwIn'); if (pw) { pw.focus(); pw.onkeydown = e => { if (e.key === 'Enter') ACT.checkPw(); }; }
}
function showToast(t) { toast = t; render(); setTimeout(() => { toast = ''; render(); }, 1800); }

/* ================= 通知の流れ ================= */
function incoming(kind) {
  if (!DB.running) return;  // 停止中は受付も通知も止まっている
  if (!registered || view === 'start') { ACT.startNotify(); }
  if (kind === 'staff' && !DB.settings.staffNotify) return showToast('（職員開錠は「通知しない」設定です）');
  const item = { kind, time: now().t };
  if (showing || handling) { queue.push(item); render(); } else { showItem(item); }
}
function showItem(item) {
  showing = item;
  if (CALL_TEXT[item.kind]) { startRing(); render(); return; }
  pin(); showing.left = DB.settings.noticeSec; render();
  clearInterval(noticeTimer);
  noticeTimer = setInterval(() => {
    showing.left--;
    if (showing.left <= 0) { clearInterval(noticeTimer); next(); }
    else { const l = frame.querySelector('[data-left]'); if (l) l.textContent = showing.left; const b = frame.querySelector('.timer i'); if (b) b.style.width = showing.left / DB.settings.noticeSec * 100 + '%'; }
  }, 1000);
}
function next() { showing = null; handling = null; stopRing(); clearInterval(noticeTimer); if (queue.length) showItem(queue.shift()); else render(); }

/* ================= 操作 ================= */
let afterPw = null;
function needPw(why, fn) { if (unlocked) return fn(); afterPw = fn; modal = { type: 'pw', why }; render(); }
const ACT = {
  startNotify: () => { ac().resume(); view = 'idle'; render(); },
  toggleSound: () => { DB.settings.soundOn = !DB.settings.soundOn; if (!DB.settings.soundOn) stopRing(); else if (showing && CALL_TEXT[showing.kind]) startRing(); render(); },
  openLog: () => { view = 'admin'; tab = 'log'; render(); },
  openMenu: () => needPw('管理メニューを開くには管理パスワードを入れてください。', () => { view = 'admin'; tab = 'settings'; render(); }),
  toIdle: () => { view = 'idle'; unlocked = false; render(); },
  tab: t => { const n = NAV.find(x => x[0] === t); if (n[3]) needPw(`「${n[2]}」を開くには管理パスワードを入れてください。`, () => { tab = t; render(); }); else { tab = t; render(); } },
  checkPw: () => { const v = document.getElementById('pwIn').value; if (v === '0000') { unlocked = true; modal = null; const f = afterPw; afterPw = null; f(); } else { modal.err = true; render(); } },
  closeModal: () => { modal = null; afterPw = null; render(); },
  logFilter: k => { logFilter = k; render(); },
  csv: () => { const f = () => showToast('CSV をダウンロードしました（見本）'); if (unlocked) f(); else { afterPw = f; modal = { type: 'pw', why: 'CSV には電話番号が含まれます。管理パスワードを入れてください。' }; render(); } },
  ack: () => { stopRing(); handling = showing; showing = null; render(); },
  done: () => { handling = null; next(); },
  set: a => { const [k, v] = a.split('|'); DB.settings[k] = v === 'true' ? true : v === 'false' ? false : +v; render(); },
  tryNotice: i => NOTICE_SOUNDS[+i][1](),
  tryCall: i => { const s = CALL_SOUNDS[+i]; s[1](); setTimeout(s[1], s[2]); },
  save: () => { frame.querySelectorAll('[data-num]').forEach(el => DB.settings[el.dataset.num] = +el.value); showToast('保存しました'); },
  changePw: k => { modal = { type: 'change', label: k === 'admin' ? '管理パスワード' : '扉用の暗証番号' }; render(); },
  changeDone: () => { modal = null; showToast('変更しました'); },
  move: a => { const [k, i, d] = a.split('|'); const L = DB[k], j = +i + +d; if (j < 0 || j >= L.length) return; [L[+i], L[j]] = [L[j], L[+i]]; render(); },
  remove: a => { const [k, i] = a.split('|'); modal = { type: 'confirm', title: '削除しますか？', text: `「${DB[k][+i]}」を一覧から削除します。`, ok: '削除する', danger: true, fn: () => { DB[k].splice(+i, 1); } }; render(); },
  add: k => { const el = frame.querySelector(`[data-add="${k}"]`); if (el.value.trim()) { DB[k].push(el.value.trim()); render(); } },
  addPast: () => { modal = { type: 'addPast' }; render(); },
  addPastDone: () => { modal = null; DB.past.push(['山田 太郎', 'ヤマダタロウ', '—', '—', '手入力']); showToast('追加しました（見本）'); },
  removePast: i => { modal = { type: 'confirm', title: '削除しますか？', text: `「${DB.past[+i][0]} 様」を過去の入居者から削除します。受付画面で探せなくなります。`, ok: '削除する', danger: true, fn: () => DB.past.splice(+i, 1) }; render(); },
  confirmPower: () => { modal = { type: 'confirm', title: '受付を止めますか？', text: '受付画面とこの画面が真っ暗になり、受付と通知が止まります。<br>再開するときは、この画面に触れて「受付を再開する」を押してください。', ok: '止める', danger: true, fn: () => { DB.running = false; view = 'idle'; } }; render(); },
  wake: () => { blackShow = true; render(); clearTimeout(blackTimer); blackTimer = setTimeout(() => { blackShow = false; render(); }, 8000); },
  resume: () => { DB.running = true; blackShow = false; render(); showToast('受付を再開しました'); },
  confirmOk: () => { const f = modal.fn; modal = null; f(); render(); },
  unregister: i => { modal = { type: 'confirm', title: '登録を解除しますか？', text: `「${DB.devices[+i][0]}」は、もう一度登録するまで使えなくなります。紛失・故障したときに使います。`, ok: '解除する', danger: true, fn: () => DB.devices.splice(+i, 1) }; render(); },
  regDone: () => { registered = true; view = 'start'; render(); },
  toast: t => showToast(t),
  dismiss: () => next(),
};
frame.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; ACT[el.dataset.act](el.dataset.arg); });
function openUnregistered() { stopRing(); showing = null; handling = null; queue = []; modal = null; registered = false; render(); }

setInterval(() => { frame.querySelectorAll('[data-time]').forEach(el => el.textContent = now().t); frame.querySelectorAll('[data-date]').forEach(el => el.textContent = now().d); }, 10000);
function fit() {
  const sc = document.getElementById('scaler');
  const top = sc.getBoundingClientRect().top + window.scrollY;
  const s = Math.max(.3, Math.min((window.innerWidth - 60) / 1280, (window.innerHeight - top - 24) / 800, 1));
  sc.style.transform = `scale(${s})`; sc.style.width = 1280 * s + 'px'; sc.style.height = 800 * s + 'px';
}
window.addEventListener('resize', fit);

// 確認用: #idle / #settings / #lists / #past / #power / #adv / #log / #reg / #call
const h = location.hash.slice(1);
if (h === 'reg') registered = false;
else if (h === 'idle') view = 'idle';
else if (TABS[h]) { view = 'admin'; tab = h; unlocked = true; }
else if (h === 'call') { view = 'idle'; showing = { kind: 'fam', time: '14:06' }; }
render(); fit();
</script>
</body>
</html>
