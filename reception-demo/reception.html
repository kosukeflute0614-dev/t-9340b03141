<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付画面 プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #2b2f36; font-family: "Noto Sans JP", sans-serif; min-height: 100vh; }

  /* ===== 確認用バー（本番には出ない） ===== */
  .bar { position: sticky; top: 0; z-index: 10; background: #1c1f24; color: #cfd5de; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; line-height: 1.6; }
  .bar button { background: #3a3f48; color: #fff; border: 0; padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .bar b { color: #fff; }
  .bar .sid { background: #3d7bfd; color: #fff; padding: 3px 10px; border-radius: 6px; font-weight: 700; }
  .stage { padding: 16px; display: flex; justify-content: center; }
  .scaler { transform-origin: top left; }

  /* ===== タブレット（1280×800 横向き） ===== */
  .frame {
    --blue: #0000c8; --bg: #f4f5fd; --text: #1d2140; --sub: #5f6480; --line: #dfe1f5; --tint: #e8e9fb; --tint2: #eceefb;
    --warm-bg: #fff6e9; --warm: #f5a524; --warm-text: #5c3a0c; --danger: #d64545;
    --shadow: 0 8px 24px rgba(0,0,200,.08);
    width: 1280px; height: 800px; border-radius: 28px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 14px #111, 0 20px 60px rgba(0,0,0,.5);
    background: var(--bg); color: var(--text); font-family: "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; user-select: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }

  /* ヘッダー（トップ） */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 22px 48px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo-img { height: 46px; }
  .divider { width: 1px; height: 34px; background: #d3d6ee; }
  .facility { font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  .clock { text-align: right; }
  .time { font-size: 40px; font-weight: 700; letter-spacing: .04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .date { font-size: 16px; opacity: .8; margin-top: 6px; }

  /* ヘッダー（途中の画面） */
  .step-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px 0; }
  .steps { display: flex; gap: 10px; align-items: center; font-size: 16px; color: var(--sub); }
  .steps .flow { font-weight: 700; color: var(--text); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 34px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.on { background: var(--blue); }
  .step-head .time { font-size: 26px; }

  /* トップ */
  .welcome { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 18px 0 20px; }
  .welcome .char { width: 84px; height: 84px; }
  .welcome h1 { font-size: 46px; font-weight: 700; letter-spacing: .1em; color: var(--blue); }
  .welcome p { font-size: 22px; margin-top: 4px; color: var(--sub); }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 1fr 1fr; grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 22px; padding: 0 48px; }
  .btn { border: 0; background: #fff; border-radius: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; transition: transform .08s; }
  .btn:active, .choice:active, .key:active, .np:active { transform: scale(.97); }
  .icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); color: var(--blue); flex: none; }
  .icon svg { width: 42px; height: 42px; }
  .btn .title { font-size: 30px; font-weight: 700; line-height: 1.3; letter-spacing: .02em; }
  .btn .sub { font-size: 17px; color: var(--sub); line-height: 1.4; }
  .btn.primary { grid-row: span 2; border: 4px solid var(--blue); }
  .btn.primary .icon { width: 120px; height: 120px; background: var(--blue); color: #fff; }
  .btn.primary .icon svg { width: 64px; height: 64px; }
  .btn.primary .title { font-size: 44px; }
  .btn.primary .sub { font-size: 20px; }
  .btn.call { background: var(--warm-bg); color: var(--warm-text); }
  .btn.call .icon { background: var(--warm); color: #fff; }
  .btn.call .sub { color: #8a6a3a; }
  .top-foot { display: flex; justify-content: flex-end; padding: 14px 48px 18px; }
  .staff { background: transparent; border: 0; color: #8c90aa; border-radius: 999px; padding: 8px 20px; font-size: 15px; display: flex; align-items: center; gap: 6px; }

  /* 質問 */
  .question { padding: 16px 48px 0; }
  .question h2 { font-size: 34px; font-weight: 700; }
  .question p { font-size: 18px; color: var(--sub); margin-top: 6px; }
  .field { margin: 14px 48px 0; height: 84px; border-radius: 20px; border: 3px solid var(--blue); background: #fff; display: flex; align-items: center; padding: 0 28px; font-size: 44px; font-weight: 700; letter-spacing: .1em; }
  .field .ph { color: #a7acc4; font-weight: 500; font-size: 26px; letter-spacing: 0; }
  .caret { width: 3px; height: 48px; background: var(--blue); margin-left: 4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 50音キーボード */
  .kb { margin: 14px 48px 0; display: grid; grid-template-columns: 1.6fr repeat(10, 1fr); gap: 8px; flex: 1; min-height: 0; }
  .kb .col { display: grid; grid-template-rows: repeat(5, 1fr); gap: 8px; }
  .key { border: 0; background: #fff; border-radius: 16px; font-size: 28px; font-weight: 700; box-shadow: 0 3px 0 var(--line); }
  .key.blank { visibility: hidden; }
  .key.fn { font-size: 18px; background: var(--tint2); }
  .key.fn .big { font-size: 34px; line-height: 1; margin-right: 4px; vertical-align: middle; }

  /* 下のナビ */
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 48px 20px; gap: 16px; margin-top: auto; }
  .nav .left { display: flex; gap: 12px; }
  .navbtn { border-radius: 20px; font-size: 20px; padding: 16px 28px; font-weight: 700; border: 0; background: #fff; box-shadow: var(--shadow); }
  .navbtn.next { background: var(--blue); color: #fff; padding: 16px 64px; font-size: 24px; }
  .navbtn.next:disabled { background: #c5c8e6; cursor: default; }

  /* 選択肢 */
  .choices { flex: 1; min-height: 0; padding: 20px 48px 0; display: grid; gap: 18px; align-content: start; }
  .choices.c2 { grid-template-columns: repeat(2, 1fr); }
  .choices.c3 { grid-template-columns: repeat(3, 1fr); }
  .choice { border: 0; background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 24px 28px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 20px; text-align: left; min-height: 104px; transition: transform .08s; }
  .choice .room { font-size: 22px; color: var(--blue); background: var(--tint); border-radius: 12px; padding: 8px 14px; white-space: nowrap; }
  .choice .sama { font-size: 22px; font-weight: 500; color: var(--sub); margin-left: 6px; }
  .choice.center { justify-content: center; text-align: center; }
  .choices.c3 .choice { font-size: 26px; padding: 20px; }
  .choice.ghost { background: transparent; box-shadow: none; border: 2px dashed #b9bde0; color: var(--sub); font-size: 24px; }

  /* 人数 */
  .counter { flex: 1; display: flex; align-items: center; justify-content: center; gap: 56px; }
  .cbtn { width: 140px; height: 140px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow); font-size: 72px; font-weight: 500; color: var(--blue); line-height: 1; }
  .cbtn:disabled { color: #c5c8e6; }
  .cval { font-size: 120px; font-weight: 700; min-width: 220px; text-align: center; font-variant-numeric: tabular-nums; }
  .cval small { font-size: 40px; margin-left: 8px; }

  /* テンキー */
  .numwrap { flex: 1; min-height: 0; display: flex; gap: 40px; padding: 14px 48px 0; }
  .numwrap .left { flex: 1; display: flex; flex-direction: column; }
  .numwrap .field { margin: 0; }
  .numpad { width: 460px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; }
  .np { border: 0; background: #fff; border-radius: 18px; font-size: 36px; font-weight: 700; box-shadow: 0 3px 0 var(--line); }
  .np.fn { font-size: 18px; background: var(--tint2); }
  .hint { margin-top: 14px; font-size: 18px; color: var(--sub); }
  .hint.err { color: var(--danger); font-weight: 700; }

  /* 確認 */
  .confirm { margin: 16px 48px 0; background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 8px 32px; }
  .crow { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid #eceef8; gap: 24px; }
  .crow:last-child { border-bottom: 0; }
  .crow .k { width: 200px; font-size: 20px; color: var(--sub); }
  .crow .v { flex: 1; font-size: 30px; font-weight: 700; }
  .crow .v small { font-size: 20px; color: var(--sub); font-weight: 500; margin-left: 8px; }
  .fix { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 18px; font-size: 18px; font-weight: 700; color: var(--blue); }

  /* 完了・お知らせ */
  .done { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  .done .big-icon { width: 160px; height: 160px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; margin-bottom: 32px; animation: pop .4s ease-out; }
  .done .big-icon svg { width: 84px; height: 84px; }
  .done .big-icon.warm { background: var(--warm); }
  .done .big-icon.gray { background: #8c90aa; }
  .done h2 { font-size: 52px; font-weight: 700; letter-spacing: .04em; }
  .done p { font-size: 26px; color: var(--sub); margin-top: 16px; line-height: 1.6; }
  .done .btns { display: flex; gap: 20px; margin-top: 40px; }
  .done .btns .navbtn { font-size: 24px; padding: 20px 40px; }
  .countdown { font-size: 17px; color: var(--sub); padding: 0 48px 24px; text-align: center; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 完了＋地図 */
  .done-map { flex: 1; min-height: 0; display: grid; grid-template-columns: 420px 1fr; gap: 32px; padding: 28px 48px 0; }
  .dm-left { display: flex; flex-direction: column; justify-content: center; }
  .dm-left .big-icon { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; animation: pop .4s ease-out; }
  .dm-left .big-icon svg { width: 56px; height: 56px; }
  .dm-left h2 { font-size: 40px; font-weight: 700; margin-top: 24px; line-height: 1.35; }
  .dm-left .dest { margin-top: 24px; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 20px 24px; }
  .dm-left .dest .who { font-size: 22px; color: var(--sub); }
  .dm-left .dest .where { font-size: 40px; font-weight: 700; color: var(--blue); margin-top: 4px; }
  .dm-left .navbtn { margin-top: 28px; align-self: flex-start; }
  .map { background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 24px 28px; display: flex; flex-direction: column; }
  .map .mtitle { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 700; }
  .map .legend { display: flex; gap: 18px; font-size: 15px; color: var(--sub); font-weight: 500; }
  .map .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
  .mgrid { flex: 1; margin-top: 18px; display: grid; grid-template-columns: repeat(20, 1fr); grid-template-rows: 1.4fr 1.4fr .6fr .6fr .6fr 1.4fr 1.4fr; gap: 3px; }
  .cell { background: #f3f4fa; border-radius: 4px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #6b708c; }
  .cell.blank { background: #f3f4fa; }
  .cell.corridor { background: transparent; }
  .cell.label { background: transparent; font-size: 14px; color: #9a9fbb; }
  .cell.here { background: var(--warm); color: #fff; font-size: 12px; }
  .cell.hit { background: var(--blue); color: #fff; animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 6px rgba(0,0,200,.25); } }

  /* ページ（画面の切り替えアニメーション用） */
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .page.in-fwd { animation: inFwd .35s ease-out; }
  .page.in-back { animation: inBack .35s ease-out; }
  .page.out-fwd { animation: outFwd .35s ease-in forwards; pointer-events: none; }
  .page.out-back { animation: outBack .35s ease-in forwards; pointer-events: none; }
  @keyframes inFwd { from { transform: translateX(80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes inBack { from { transform: translateX(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes outFwd { to { transform: translateX(-80px); opacity: 0; } }
  @keyframes outBack { to { transform: translateX(80px); opacity: 0; } }

  /* 案1: 同じ画面に結果を出す */
  .inline-res { flex: 1; min-height: 0; padding: 22px 48px 0; animation: rise .35s ease-out; }
  .inline-res .lead { font-size: 26px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .inline-res .lead .ok { width: 40px; height: 40px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
  .inline-res .lead .ok svg { width: 24px; height: 24px; }
  .inline-res .choices { padding: 0; }
  .inline-res .choice { min-height: 120px; font-size: 34px; border: 3px solid transparent; }
  .inline-res .choice { white-space: nowrap; }
  .inline-res .choices.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inline-res .choice:not(.single) { font-size: 30px; padding: 20px; gap: 14px; }
  .inline-res .choice:not(.single) .go { font-size: 17px; padding: 8px 12px; }
  .inline-res .choice.single { border-color: var(--blue); grid-column: 1 / -1; font-size: 40px; min-height: 140px; }
  .inline-res .choice .go { margin-left: auto; font-size: 20px; color: #fff; background: var(--blue); border-radius: 14px; padding: 10px 18px; white-space: nowrap; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .field.locked { border-color: var(--line); }

  /* 案4: 面会先の札 */
  .chip { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 999px; box-shadow: var(--shadow); padding: 8px 10px 8px 20px; font-size: 18px; color: var(--sub); }
  .chip b { color: var(--blue); font-size: 22px; }
  .chip button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 14px; font-size: 15px; font-weight: 700; color: var(--blue); }

  /* 確認用バーのパターン切り替え */
  .bar .mode button.on { background: #3d7bfd; }

  /* エラー */
  .error-screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 5; }
  .error-screen .big-icon { width: 160px; height: 160px; border-radius: 50%; display: grid; place-items: center; background: #8c90aa; color: #fff; margin-bottom: 32px; }
  .error-screen .big-icon svg { width: 84px; height: 84px; }
  .error-screen h2 { font-size: 52px; font-weight: 700; }
  .error-screen p { font-size: 28px; color: var(--sub); margin-top: 16px; }
</style>
</head>
<body>

<div class="bar">
  <span>表示中: <span class="sid" id="sid">S-01</span></span>
  <button onclick="home()">最初から</button>
  <button onclick="toggleError()">ネットワークエラーを表示/解除</button>
  <button onclick="toggleStop()">停止中（真っ暗）を表示/解除</button>
  <span>試せるデータ（ダミー）: 入居者 <b>ヤマダハナコ</b>（同じ読み2人）・<b>サトウケンジ</b>・<b>イトウマサオ</b>（2階）／ 以前の入居者 <b>スズキイチロウ</b>（2人）・<b>タナカミチコ</b>／ 暗証番号 <b>1234</b>／ 放置60秒で最初に戻る</span>
</div>
<div class="stage"><div class="scaler" id="scaler"><div class="frame" id="frame"></div></div></div>

<script>
/* ================= ダミーデータ ================= */
const DATA = {
  residents: [
    { room: '101', kanji: '山田 花子', kana: 'ヤマダハナコ' },
    { room: '215', kanji: '山田 華子', kana: 'ヤマダハナコ' },
    { room: '112', kanji: '佐藤 健二', kana: 'サトウケンジ' },
    { room: '118', kanji: '高橋 和子', kana: 'タカハシカズコ' },
    { room: '207', kanji: '伊藤 正夫', kana: 'イトウマサオ' },
    { room: '230', kanji: '渡辺 幸子', kana: 'ワタナベサチコ' },
  ],
  past: [
    { kanji: '鈴木 一郎', kana: 'スズキイチロウ' },
    { kanji: '鈴木 一朗', kana: 'スズキイチロウ' },
    { kanji: '田中 道子', kana: 'タナカミチコ' },
  ],
  clinics: ['サンプル内科クリニック', 'みほん訪問診療所', 'ダミー歯科（訪問）', 'テスト訪問看護ステーション', 'れい薬局'],
  vendors: ['サンプルリネン', 'ダミー給食サービス', 'テスト設備点検', 'みほんクリーニング'],
  relations: ['子', '孫', '兄弟', '配偶者', '友人', 'その他'],
  pin: '1234',
  resetSec: 60, doneSec: 5, mapSec: 30,
};

/* ================= アイコン ================= */
const I = {
  visit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 13.8c2.9-.4 5.5 1.5 5.5 4.7"/></svg>',
  med: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
  vend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  fam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V11"/><path d="M12 11c0-3 2-5 5-5 0 3-2 5-5 5zM12 11c0-3-2-5-5-5 0 3 2 5 5 5z"/><path d="M8 21h8"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>',
  lock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  door: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M6 21V4h9v17"/><path d="M15 6l4 1.5V21"/><circle cx="12.5" cy="12.5" r=".6" fill="currentColor"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/><path d="M9 9l4 4M13 9l-4 4"/></svg>',
  wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/><path d="M3 3l18 18"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
};

/* ================= 状態 ================= */
let cur = 'S01', st = {}, timers = [], idleTimer = null, errorOn = false, mode = 'm1', navDir = null;  // 見つかったときの見せ方は「案1 同じ画面に結果」に決定（2026-11-12）
function resetState() {

const norm = s => s.replace(/[\s　]/g, '').replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

const pad = n => String(n).padStart(2, '0');
function nowText() { const d = new Date(); return { t: `${pad(d.getHours())}:${pad(d.getMinutes())}`, d: `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）` }; }
const FLOWS = { visit: ['ご面会の受付', ['入居者様', 'お名前', '人数', 'ご関係', '電話番号', '確認']], med: ['クリニック/薬局の方', null], vend: ['業者の方', null], fam: ['ご家族の受付', ['故人様', 'ご関係']], staff: ['スタッフ用', null] };
function stepHead(stepIndex) {
  const [title, steps] = FLOWS[st.flow] || ['', null];
  const dots = steps ? `<span class="dots">${steps.map((_, i) => `<i class="dot ${i <= stepIndex ? 'on' : ''}"></i>`).join('')}</span><span>${stepIndex + 1} / ${steps.length}</span>` : '';
  let chip = '';
  if (mode === 'm4' && st.flow === 'visit' && st.resident && ['S05','S06','S07','S08','S09'].includes(cur))
    chip = `<div class="chip">ご面会先<b>${st.resident.room}号室 ${st.resident.kanji} 様</b><button data-act="changeTarget">変更</button></div>`;
  if (mode === 'm4' && st.flow === 'fam' && st.past && ['S43','S44'].includes(cur))
    chip = `<div class="chip">故人様<b>${st.past.kanji} 様</b><button data-act="changeTarget">変更</button></div>`;
  return `<div class="step-head"><div class="steps"><span class="flow">${title}</span>${dots}</div>${chip}<div class="time" data-time>${nowText().t}</div></div>`;
}
function nav({ back = true, next = null, nextLabel = 'つぎへ ›', disabled = false } = {}) {
  return `<div class="nav"><div class="left">${back ? '<button class="navbtn" data-act="back">‹ もどる</button>' : ''}<button class="navbtn" data-act="home">最初にもどる</button></div>${next ? `<button class="navbtn next" data-act="${next}" ${disabled ? 'disabled' : ''}>${nextLabel}</button>` : ''}</div>`;
}
function fieldHTML(val, ph = 'ここに表示されます') { return `<div class="field">${val ? `<span>${val}</span><i class="caret"></i>` : `<span class="ph">${ph}</span>`}</div>`; }

const COLS = [['ア','イ','ウ','エ','オ'],['カ','キ','ク','ケ','コ'],['サ','シ','ス','セ','ソ'],['タ','チ','ツ','テ','ト'],['ナ','ニ','ヌ','ネ','ノ'],['ハ','ヒ','フ','ヘ','ホ'],['マ','ミ','ム','メ','モ'],['ヤ','','ユ','','ヨ'],['ラ','リ','ル','レ','ロ'],['ワ','ヲ','ン','ー','']];
function kbHTML() {
  const fn = [['<span class="big">゛</span>てんてん','daku'],['<span class="big">゜</span>まる','handaku'],['小さい字','small'],['1字消す','del'],['全部消す','clear']]
    .map(([t, a]) => `<button class="key fn" data-act="kfn" data-arg="${a}">${t}</button>`).join('');
  const cols = [...COLS].reverse().map(c => `<div class="col">${c.map(ch => ch ? `<button class="key" data-act="key" data-arg="${ch}">${ch}</button>` : '<span class="key blank"></span>').join('')}</div>`).join('');
  return `<div class="kb"><div class="col">${fn}</div>${cols}</div>`;
}
const DAKU = {カ:'ガ',キ:'ギ',ク:'グ',ケ:'ゲ',コ:'ゴ',サ:'ザ',シ:'ジ',ス:'ズ',セ:'ゼ',ソ:'ゾ',タ:'ダ',チ:'ヂ',ツ:'ヅ',テ:'デ',ト:'ド',ハ:'バ',ヒ:'ビ',フ:'ブ',ヘ:'ベ',ホ:'ボ',ウ:'ヴ'};
const HANDAKU = {ハ:'パ',ヒ:'ピ',フ:'プ',ヘ:'ペ',ホ:'ポ'};
const SMALL = {ア:'ァ',イ:'ィ',ウ:'ゥ',エ:'ェ',オ:'ォ',ツ:'ッ',ヤ:'ャ',ユ:'ュ',ヨ:'ョ'};
const inv = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [v, k]));
const MODS = { daku: [DAKU, inv(DAKU)], handaku: [HANDAKU, inv(HANDAKU)], small: [SMALL, inv(SMALL)] };

function numpadHTML() {
  const k = ['1','2','3','4','5','6','7','8','9'].map(n => `<button class="np" data-act="num" data-arg="${n}">${n}</button>`).join('');
  return `<div class="numpad">${k}<button class="np fn" data-act="numdel">1字消す</button><button class="np" data-act="num" data-arg="0">0</button><button class="np fn" data-act="numclear">全部消す</button></div>`;
}
const fmtPhone = p => /^0[789]0\d{8}$/.test(p) ? `${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}` : p;
const phoneOk = p => /^0\d{9,10}$/.test(p);

/* ---- フロアマップ（ダミー: 各階 40 室。本番は地図シートの見た目を再現） ---- */
function mapCells(floor, target) {
  // 20列 × 7行: [部屋番号, 下のセル] × 上下2列 ＋ 廊下
  const rows = [];
  const top = Array.from({ length: 20 }, (_, i) => `${floor}${pad(i + 1)}`);
  const bottom = Array.from({ length: 20 }, (_, i) => `${floor}${pad(i + 21)}`);
  const cell = (cls, txt = '') => `<div class="cell ${cls}">${txt}</div>`;
  rows.push(top.map(n => cell(n === target ? 'hit' : '', n)).join(''));
  rows.push(top.map(n => cell(n === target ? 'hit' : 'blank')).join(''));
  rows.push(Array.from({ length: 20 }, (_, i) => i === 0 ? cell('label', 'EV') : i === 10 ? cell('label', '廊下') : cell('corridor')).join(''));
  rows.push(Array.from({ length: 20 }, (_, i) => floor === '1' && i === 0 ? cell('here', '現在地') : cell('corridor')).join(''));
  rows.push(Array.from({ length: 20 }, (_, i) => cell('corridor')).join(''));
  rows.push(bottom.map(n => cell(n === target ? 'hit' : '', n)).join(''));
  rows.push(bottom.map(n => cell(n === target ? 'hit' : 'blank')).join(''));
  return rows.join('');
}

/* ================= 操作 ================= */
const BACK = { S02: 'S01', S03: 'S02', S04: 'S02', S05: 'S02', S06: 'S05', S07: 'S06', S08: 'S07', S09: 'S07', S10: 'S09', S20: 'S01', S21: 'S20', S30: 'S01', S31: 'S30', S40: 'S01', S41: 'S40', S42: 'S40', S43: 'S40', S44: 'S43', S60: 'S01', S61: 'S60' };
function after(next) { if (st.ret) { const r = st.ret; st.ret = null; go(r); } else go(next); }

const ACT = {
  home: () => home(),
  back: () => go(BACK[cur] || 'S01', 'back'),
  go: a => go(a),
  start: f => {
    resetState(); st.flow = f;
    if (f === 'visit') go('S02'); else if (f === 'med') go('S20'); else if (f === 'vend') go('S30');
    else if (f === 'fam') go('S40'); else if (f === 'staff') go('S60'); else if (f === 'call') go('S51');
  },
  key: ch => { st[FIELD[cur]] += ch; render(); },
  kfn: a => {
    const f = FIELD[cur], v = st[f];
    if (a === 'del') st[f] = v.slice(0, -1);
    else if (a === 'clear') st[f] = '';
    else { const [m, u] = MODS[a], last = v.slice(-1); if (m[last]) st[f] = v.slice(0, -1) + m[last]; else if (u[last]) st[f] = v.slice(0, -1) + u[last]; }
    render();
  },
  num: n => { const f = cur === 'S60' ? 'pin' : 'phone'; if (st[f].length < 11) st[f] += n; render(); },
  numdel: () => { const f = cur === 'S60' ? 'pin' : 'phone'; st[f] = st[f].slice(0, -1); render(); },
  numclear: () => { const f = cur === 'S60' ? 'pin' : 'phone'; st[f] = ''; render(); },

  searchResident: () => {
    st.matches = DATA.residents.filter(r => r.kana === norm(st.kana));
    if (st.matches.length === 0) return go('S04');
    if (mode === 'm1') { st.inline = true; return render(); }
    if (st.matches.length === 1 && (mode === 'm4' || mode === 'm5')) { st.resident = st.matches[0]; return after('S05'); }
    go('S03');
  },
  pickResident: i => { st.resident = st.matches[+i]; st.inline = false; after('S05'); },
  editKana: () => { st.inline = false; render(); },
  changeTarget: () => { st.kana = ''; st.inline = false; if (st.flow === 'fam') { st.past = null; go('S40', 'back'); } else { st.resident = null; go('S02', 'back'); } },
  retryResident: () => { st.kana = ''; go('S02', 'back'); },
  callFromNotFound: () => go('S51'),
  nextName: () => after('S06'),
  cnt: d => { st.count = Math.max(1, st.count + (+d)); render(); },
  nextCount: () => after('S07'),
  pickRelation: r => {
    st.relation = r;
    if (st.flow === 'fam') { if (r === 'その他') go('S44'); else go('S52'); }
    else { if (r === 'その他') go('S08'); else after('S09'); }
  },
  nextRelOther: () => after('S09'),
  nextPhone: () => go('S10'),
  fix: to => { st.ret = 'S10'; if (to === 'S02') { st.kana = ''; } go(to); },
  submitVisit: () => go('S11'),

  pickClinic: i => { st.clinic = DATA.clinics[+i]; st.msg = '扉が開きます'; go('S50'); },
  submitMed: () => { st.msg = '扉が開きます'; go('S50'); },
  pickVendor: i => { st.vendor = DATA.vendors[+i]; st.msg = '扉が開きます'; go('S50'); },
  submitVend: () => { st.msg = '扉が開きます'; go('S50'); },

  searchPast: () => {
    st.matches = DATA.past.filter(r => r.kana === norm(st.kana));
    if (st.matches.length === 0) return go('S42');
    if (mode === 'm1') { st.inline = true; return render(); }
    if (st.matches.length === 1 && (mode === 'm4' || mode === 'm5')) { st.past = st.matches[0]; return go('S43'); }
    go('S41');
  },
  pickPast: i => { st.past = st.matches[+i]; st.inline = false; go('S43'); },
  retryPast: () => { st.kana = ''; go('S40', 'back'); },
  submitFam: () => go('S52'),

  checkPin: () => { if (st.pin === DATA.pin) { st.msg = '扉を開けました'; go('S50'); } else go('S61'); },
  retryPin: () => { st.pin = ''; go('S60'); },
};

/* ================= 描画 ================= */
const frame = document.getElementById('frame');
function go(id, dir = 'fwd') { cur = id; navDir = dir; render(); }
function home() { resetState(); go('S01', 'back'); }
function render() {
  timers.forEach(clearInterval); timers = [];
  const animate = mode === 'm5' && navDir;
  const old = frame.querySelector('.page');
  const html = `<div class="page ${animate ? 'in-' + navDir : ''}">${SCREENS[cur]()}</div>`;
  if (animate && old) {
    old.className = 'page out-' + navDir;
    frame.querySelectorAll('.error-screen').forEach(e => e.remove());
    frame.insertAdjacentHTML('beforeend', html + (errorOn ? errorHTML() : ''));
    setTimeout(() => old.remove(), 360);
  } else {
    frame.innerHTML = html + (errorOn ? errorHTML() : '') + (stopped ? '<div class="error-screen" style="background:#000"></div>' : '');
  }
  navDir = null;
  document.getElementById('sid').textContent = cur.replace('S', 'S-');
  // 完了画面は自動でトップへ
  const cd = frame.querySelector('.page:last-of-type [data-countdown]') || frame.querySelector('[data-countdown]');
  if (cd) {
    let left = cur === 'S11' ? DATA.mapSec : DATA.doneSec;
    const show = () => cd.textContent = `${left}秒後に最初の画面にもどります`;
    show();
    timers.push(setInterval(() => { left--; if (left <= 0) home(); else show(); }, 1000));
  }
  resetIdle();
}
function errorHTML() { return `<div class="error-screen"><div class="big-icon">${I.wifi}</div><h2>ネットワークエラー</h2><p>事務所にお声かけください</p></div>`; }
let stopped = false;
function toggleStop() { stopped = !stopped; home(); }
function toggleError() { errorOn = !errorOn; if (!errorOn) home(); else render(); }
frame.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || errorOn || stopped) return;
  ACT[el.dataset.act](el.dataset.arg);
});
// 放置で最初にもどる
function resetIdle() { clearTimeout(idleTimer); if (cur !== 'S01') idleTimer = setTimeout(home, DATA.resetSec * 1000); }
// 時計
setInterval(() => { const n = nowText(); frame.querySelectorAll('[data-time]').forEach(el => el.textContent = n.t); frame.querySelectorAll('[data-date]').forEach(el => el.textContent = n.d); }, 10000);

/* ================= 縮小表示 ================= */
function fit() {
  const sc = document.getElementById('scaler');
  const top = sc.getBoundingClientRect().top + window.scrollY;
  const s = Math.max(.3, Math.min((window.innerWidth - 60) / 1280, (window.innerHeight - top - 24) / 800, 1));
  sc.style.transform = `scale(${s})`; sc.style.width = 1280 * s + 'px'; sc.style.height = 800 * s + 'px';
}
window.addEventListener('resize', fit);

function setMode(m) {
  mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  home();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));

// URL の # で画面を指定（確認用。例: #S11）
resetState();
// 確認用デモ（例: #demo-m1-イトウマサオ → 案1で面会者の検索まで自動で進める。"-name" を付けるとお名前画面まで）
const dm = decodeURIComponent(location.hash).match(/^#demo-(cur|m1|m4|m5)-([ァ-ヶー]+)(-name)?$/);
if (dm) {
  mode = dm[1]; document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  ACT.start('visit'); st.kana = dm[2]; ACT.searchResident();
  if (dm[3]) { if (cur === 'S03' || st.inline) ACT.pickResident('0'); }
  fit();
  throw 'demo';
}
const h = location.hash.slice(1);
if (h && SCREENS[h]) {
  st.flow = h >= 'S60' ? 'staff' : h >= 'S40' && h < 'S50' ? 'fam' : h >= 'S30' && h < 'S40' ? 'vend' : h >= 'S20' && h < 'S30' ? 'med' : 'visit';
  st.resident = DATA.residents[4]; st.past = DATA.past[0]; st.kana = 'ヤマダハナコ'; st.name = 'ヤマダイチロウ'; st.count = 2; st.relation = '子'; st.phone = '09012345678';
  st.matches = h === 'S41' ? DATA.past.slice(0, 2) : DATA.residents.slice(0, 2);
  go(h);
} else go('S01');
fit();
</script>
</body>
